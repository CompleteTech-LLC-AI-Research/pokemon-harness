[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokered-harness"
version = "0.1.0"
description = "Memory-first automation harness for Pokémon Red via PyBoy, exposed over MCP."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "LGPL-3.0-only" }
dependencies = [
    "mcp>=1.0",
    "cython>=3.0.6,<3.1,!=3.0.10",
    "numpy",
    "pydantic>=2.6",
    "pysdl2",
    "pysdl2-dll",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools]
include-package-data = true

# Package the pinned PyBoy fork into the same distribution as the harness.
# This keeps editable installs and wheels on the identical runtime without a
# local-path dependency (which is not valid in wheel metadata).
packages = [
    "pokered_harness",
    "pokered_harness.events",
    "pokered_harness.link",
    "pokered_harness.state",
    "pokered_harness.symbols",
    "pyboy",
    "pyboy.api",
    "pyboy.core",
    "pyboy.core.cartridge",
    "pyboy.link",
    "pyboy.logging",
    "pyboy.plugins",
]

[tool.setuptools.package-dir]
"" = "src"
pyboy = "vendor/pyboy-src/pyboy"

[tool.setuptools.package-data]
"pyboy.core" = ["*.bin"]
"pyboy.plugins" = ["font.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "unit: ROM-free deterministic tests",
    "real_rom: requires a BYO ROM and symbol file",
    "local_link: real-ROM in-process link tests",
    "remote_link: real-ROM TCP or subprocess link tests",
    "mcp_stdio: real-ROM MCP stdio integration tests",
    "acceptance: optional real-ROM trade or battle acceptance",
    "trade: optional real-ROM trade coverage",
    "battle: optional real-ROM battle coverage",
    "timing_sensitive: repeatable scheduling-sensitive regression",
]

[tool.ruff]
line-length = 100
target-version = "py311"

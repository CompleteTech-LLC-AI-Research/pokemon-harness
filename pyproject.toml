[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokered-harness"
version = "0.1.0"
description = "Memory-first automation harness for Pokémon Red via PyBoy, exposed over MCP."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "LGPL-3.0-only" }
dependencies = [
    "pyboy==2.7.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]
mcp = [
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
